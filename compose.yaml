services:
  orca-web:
    build: .
    ports:
      - "3000:3000"
    environment:
      ORCA_SLICER_BIN: /opt/orca/OrcaSlicer
    volumes:
      - orca-data:/data
      # Provide the OrcaSlicer Linux binary from your host.
      - ${ORCA_SLICER_BIN:?Set ORCA_SLICER_BIN to the host binary}:/opt/orca/OrcaSlicer:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  orca-data:
